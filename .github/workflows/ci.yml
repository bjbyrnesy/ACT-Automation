name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15.2"

      - name: Install Graphviz + gitleaks + yq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          sudo curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_amd64" \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version




      - name: Sync dependencies
        # ui extra provides FastAPI for web TestClient collection.
        run: uv sync --extra dev --extra ui

      - name: Pre-commit (gitleaks, black, ruff, …)
        run: uv run pre-commit run --all-files

      - name: Pytest
        run: uv run --extra dev --extra ui pytest -q --tb=short

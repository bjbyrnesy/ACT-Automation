# Local gates before git commit/push. CI re-runs the same suite.
# Install once per clone:
#   uv sync --extra dev && uv run pre-commit install --install-hooks
# Bypass one hook (rare):  SKIP=gitleaks git commit …

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: false

repos:
  # --- secrets / leak prevention (primary local shield) ---
  # Use gitleaks-system (PATH binary) — language: golang hangs in household
  # Forgejo runners downloading the Go toolchain / modules.
  # Local: brew install gitleaks. CI: workflow installs the release tarball.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        name: gitleaks (staged secrets)
        # Must set explicitly — duplicate hook ids can drop upstream defaults.
        pass_filenames: false
      # Full scan on push — catches anything that slipped past --no-verify.
      - id: gitleaks-system
        alias: gitleaks-push
        name: gitleaks (pre-push)
        stages: [pre-push]
        entry: gitleaks git --redact --verbose
        pass_filenames: false



  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        # Only committed YAML (Actions / this file); lab topologies stay gitignored.
        files: '^(\.github/|\.pre-commit-config\.yaml)'
      - id: check-toml

  - repo: local
    hooks:
      # language: fail → always fails when any matching path is staged
      - id: forbid-secret-filenames
        name: forbid committing .config / .env / secrets files
        language: fail
        entry: >-
          Secret-bearing path staged — unstage it (must stay gitignored).
          Use .env.example / .config.example for templates only.
        files: >-
          (^|/)\.config(\.|$)|(^|/)\.env(\.|$)|(^|/)secrets(\.|$)|credentials\.json$
        exclude: '\.example$'
        stages: [pre-commit, pre-push]

  # --- formatting / lint (same tools as CI) ---
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        language_version: python3.15

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--fix]

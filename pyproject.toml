[project]
name = "acta"
version = "0.1.0"
description = "ACT Automation CLI"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
  "pyyaml>=6.0",
  "httpx>=0.28",
  "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
  "black>=25.0",
  "pre-commit>=4.0",
]

[project.scripts]
acta = "acta.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.black]
line-length = 88
target-version = ["py315"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acta"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint + test
    runs-on: ansible-net10
    # Official CPython 3.15.2 — uv's python-build-standalone linux builds are
    # still on 3.15 alphas (e.g. 3.15.0a5) that lack builtins.sentinel and break
    # hatchling/packaging.
    container:
      image: python:3.15.2-slim-bookworm@sha256:1ec2babe71a186a01d1573326faf2ed410f62122dc2e687455b6d48ab8606363
    steps:
      - name: Install host tools + uv + gitleaks
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl ca-certificates graphviz build-essential \
            bash openssh-client sudo
          # Match GitHub-hosted runners: non-root so DEPLOY_SCRIPT takes the
          # sudo path (root skips sudo and breaks umask/invocation tests).
          id -u ci >/dev/null 2>&1 || useradd --create-home --uid 1000 ci
          echo 'ci ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/ci

          # System-wide so the non-root pytest user can exec uv.
          curl -LsSf https://astral.sh/uv/0.9.30/install.sh | UV_INSTALL_DIR=/usr/local/bin sh
          hash -r
          uv --version

          # Binary on PATH for pre-commit gitleaks-system (avoids golang hook).
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          # Mike Farah yq v4 — required by acta.clab (YAML↔JSON) and tests.
          curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_amd64" \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq --version



      - name: Checkout
        # Inline git: household Podman runners have failed with actions/checkout
        # volume mounts (same pattern as agent-fence / opnsense-mcp).
        env:
          REPO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"
          git init
          git remote add origin "https://x-access-token:${REPO_TOKEN}@${base#https://}"
          git fetch --prune --no-tags origin "+refs/heads/*:refs/remotes/origin/*" "${GITHUB_SHA}"
          git checkout --force "${GITHUB_SHA}"
          git remote set-url origin "${base}"

      - name: Sync dependencies
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:$PATH"
          uv sync --extra dev --extra ui

      - name: Pre-commit (gitleaks, black, ruff, …)
        env:
          # Avoid hung virtualenv periodic pip updates on slow/odd egress.
          VIRTUALENV_PERIODIC_UPDATE_INTERVAL: "-1"
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:$PATH"
          uv run pre-commit run --all-files

      - name: Pytest
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:$PATH"
          chown -R ci:ci .
          # Run as ci so host_run deploy scripts exercise sudo (not root bypass).
          runuser -u ci -- env \
            HOME=/home/ci \
            PATH="/usr/local/bin:/usr/bin:/bin" \
            uv run --extra dev --extra ui pytest -q --tb=short

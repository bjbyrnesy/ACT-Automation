name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint + test
    runs-on: ansible-net10
    container:
      image: ghcr.io/astral-sh/uv:0.9.30-python3.13-bookworm-slim@sha256:531f855bda2c73cd6ef67d56b733b357cea384185b3022bd09f05e002cd144ca
    steps:
      - name: Install host tools
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl ca-certificates graphviz build-essential

      - name: Checkout
        # Inline git: household Podman runners have failed with actions/checkout
        # volume mounts (same pattern as agent-fence / opnsense-mcp).
        env:
          REPO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"
          git init
          git remote add origin "https://x-access-token:${REPO_TOKEN}@${base#https://}"
          git fetch --prune --no-tags origin "+refs/heads/*:refs/remotes/origin/*" "${GITHUB_SHA}"
          git checkout --force "${GITHUB_SHA}"
          git remote set-url origin "${base}"

      - name: Install Python 3.15 via uv
        run: |
          set -euo pipefail
          uv python install 3.15
          uv python pin 3.15

      - name: Sync dependencies
        run: uv sync --extra dev --extra ui

      - name: Pre-commit (gitleaks, black, ruff, …)
        run: uv run pre-commit run --all-files

      - name: Pytest
        run: uv run --extra dev --extra ui pytest -q --tb=short
